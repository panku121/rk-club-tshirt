<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <title>RK Cricket Club | T-Shirt Order</title>
    <link rel="icon" href="assets/rkCricketLogo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Rajdhani:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="pitch-bg" aria-hidden="true"></div>
    <div class="glow glow-left" aria-hidden="true"></div>
    <div class="glow glow-right" aria-hidden="true"></div>

    <main class="page">
      <section class="form-card">
        <header class="form-header">
          <div class="logo-wrap">
            <img
              src="assets/rkCricketLogo.png"
              alt="RK Cricket Club logo"
              class="club-logo"
            />
          </div>
          <p class="eyebrow">Season Kit Order</p>
          <h1>RK Cricket Club</h1>
          <p class="tagline">Complete the form below to place your T-shirt order</p>
        </header>

        <div class="layout">
          <form id="tshirtForm" class="order-form" novalidate>
            <div class="field">
              <label for="fullName">Full Name</label>
              <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="e.g. Rohit Sharma"
                autocomplete="name"
                maxlength="60"
                required
              />
              <span class="error" data-error-for="fullName"></span>
            </div>

            <div class="field">
              <label for="phone">Phone Number</label>
              <input
                type="tel"
                id="phone"
                name="phone"
                inputmode="numeric"
                placeholder="10-digit mobile number"
                autocomplete="tel"
                maxlength="10"
                required
              />
              <span class="error" data-error-for="phone"></span>
            </div>

            <div class="field">
              <span class="field-label" id="packageLabel">Order Package</span>
              <div class="package-grid" role="radiogroup" aria-labelledby="packageLabel">
                <label class="package-card">
                  <input type="radio" name="packageOption" value="Tshirt only (500/-)" />
                  <span class="package-name">T-Shirt Only</span>
                  <span class="package-price">₹500</span>
                </label>
                <label class="package-card">
                  <input type="radio" name="packageOption" value="Tee + Cap (700/-)" />
                  <span class="package-name">Tee + Cap</span>
                  <span class="package-price">₹700</span>
                </label>
                <label class="package-card">
                  <input type="radio" name="packageOption" value="Tee + Lower + Cap (950/-)" />
                  <span class="package-name">Tee + Lower + Cap</span>
                  <span class="package-price">₹950</span>
                </label>
              </div>
              <input type="hidden" id="orderPackage" name="orderPackage" value="" required />
              <span class="error" data-error-for="orderPackage"></span>
            </div>

            <div class="field">
              <span class="field-label" id="sizeLabel">T-Shirt Size</span>
              <div class="size-grid" role="radiogroup" aria-labelledby="sizeLabel">
                <label class="size-card">
                  <input type="radio" name="sizeOption" value="36/S" />
                  <span class="size-chest">36</span>
                  <span class="size-code">S</span>
                </label>
                <label class="size-card">
                  <input type="radio" name="sizeOption" value="38/M" />
                  <span class="size-chest">38</span>
                  <span class="size-code">M</span>
                </label>
                <label class="size-card">
                  <input type="radio" name="sizeOption" value="40/L" />
                  <span class="size-chest">40</span>
                  <span class="size-code">L</span>
                </label>
                <label class="size-card">
                  <input type="radio" name="sizeOption" value="42/XL" />
                  <span class="size-chest">42</span>
                  <span class="size-code">XL</span>
                </label>
                <label class="size-card">
                  <input type="radio" name="sizeOption" value="44/XXL" />
                  <span class="size-chest">44</span>
                  <span class="size-code">XXL</span>
                </label>
                <label class="size-card">
                  <input type="radio" name="sizeOption" value="46/3XL" />
                  <span class="size-chest">46</span>
                  <span class="size-code">3XL</span>
                </label>
                <label class="size-card">
                  <input type="radio" name="sizeOption" value="48/4XL" />
                  <span class="size-chest">48</span>
                  <span class="size-code">4XL</span>
                </label>
              </div>
              <input type="hidden" id="size" name="size" value="" required />
              <span class="error" data-error-for="size"></span>
            </div>

            <div class="field">
              <label for="backNumber">Number on T-Shirt Back</label>
              <input
                type="text"
                id="backNumber"
                name="backNumber"
                placeholder="e.g. 001, 07, 700"
                inputmode="numeric"
                maxlength="3"
                required
              />
              <span class="error" data-error-for="backNumber"></span>
            </div>

            <div class="field-row">
              <div class="field">
                <label for="backName">Name on T-Shirt Back</label>
                <input
                  type="text"
                  id="backName"
                  name="backName"
                  placeholder="PRINT NAME ON JERSEY"
                  maxlength="12"
                  required
                />
                <span class="error" data-error-for="backName"></span>
              </div>

              <div class="field">
                <label for="sleeveLength">Sleeve Length</label>
                <select id="sleeveLength" name="sleeveLength" required>
                  <option value="" disabled selected>Select sleeve length</option>
                  <option value="Full">Full</option>
                  <option value="Half">Half</option>
                  <option value="Three-Quarter Sleeve">Three-Quarter Sleeve</option>
                </select>
                <span class="error" data-error-for="sleeveLength"></span>
              </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
              <span class="btn-text">Submit Order</span>
              <span class="btn-loader" aria-hidden="true"></span>
            </button>
          </form>

          <aside class="jersey-preview" aria-hidden="true">
            <p class="preview-label">Jersey Preview</p>
            <div class="jersey" id="jerseyPreview">
              <div class="jersey-body">
                <span class="jersey-number" id="previewNumber">00</span>
                <span class="jersey-name" id="previewName">NAME</span>
              </div>
              <div class="jersey-sleeve jersey-sleeve-left"></div>
              <div class="jersey-sleeve jersey-sleeve-right"></div>
            </div>
            <p class="preview-hint">Live preview of name and number on the back</p>
          </aside>
        </div>
      </section>
    </main>

    <div id="successPopup" class="popup-overlay" role="dialog" aria-modal="true" aria-labelledby="popupTitle" hidden>
      <div class="popup-card">
        <div class="popup-icon">✓</div>
        <h2 id="popupTitle">Thank You!</h2>
        <p>Your details have been shared with the Captain.</p>
        <button type="button" id="popupClose" class="popup-btn">OK</button>
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
